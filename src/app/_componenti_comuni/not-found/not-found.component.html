  [usaAnimazioniScroll]="false">
</app-saturno>

<div class="nf-bg" >
  <div class="flex" (click)="chiudi404DaClick()">

  <div class="nf-center">
     <div class="nf-mask"
      [class.show]="mostra404"
            [class.closing]="animazione404InCorso"
      (transitionend)="onMaskTransitionEnd($event)">
      <div class="nf-num">
  <span class="d">4</span><span class="d zero">0</span><span class="d">4</span>
 <p *ngIf="cambioLinguaService.leggiCodiceLingua() === 'it'"><span class="bigbig">Clicca</span> per tornare {{ autenticato ? 'al catalogo' : 'alla pagina iniziale' }}</p>
<p *ngIf="cambioLinguaService.leggiCodiceLingua() !== 'it'"><span class="bigbig">Click</span> to go back to the {{ autenticato ? 'catalog' : 'home page' }}</p>
</div>

    </div>
  </div>
  </div>
  <app-footer *ngIf="traduzioniPronte"></app-footer>
</div>
