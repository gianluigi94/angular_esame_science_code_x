<app-saturno [usaAnimazioniIngresso]="false" [usaAnimazioniScroll]="false"></app-saturno>

<section class="login-contenuto">
  <div class="contatti-contenuto" #contattiContenuto>
    <h2>{{ 'ui.h2.contatti' | translate }}</h2>
    <dl class="contact-list">
      <div class="row">
        <dt [innerHTML]="'ui.sviluppato.contatti' | translate"></dt>
        <dd>Gianluigi Abbracciavento</dd>
      </div>
      <div class="row">
        <dt>Email</dt>
        <dd><a href="mailto:{{ mail }}">{{ mail }}</a></dd>
      </div>
      <div class="row">
        <dt [innerHTML]="'ui.indirizzo.contatti' | translate"></dt>
        <dd>{{ indirizzo }}</dd>
      </div>

      <div class="row">
  <dt> </dt>
  <dd class="special_dd" (click)="tornaIndietro()">
    {{ (sonoLoggato ? 'ui.torna.log.contatti' : 'ui.torna.contatti') | translate }}
  </dd>
</div>
    </dl>
  </div>
  <app-footer></app-footer>
</section>
